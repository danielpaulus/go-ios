        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
          description: The request has succeeded.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
          description: 401 — missing/invalid bearer token (when auth is enabled).
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
          description: 404 — device (udid) not found.
        "422":
