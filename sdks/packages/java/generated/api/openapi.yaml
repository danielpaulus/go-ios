components:
  schemas:
    AgentShutdown:
      description: '`POST /tunnel-agent/shutdown` — acknowledgement.'
      example:
        status: status
      properties:
        status:
          description: Always `agent shutdown requested`.
          type: string
      required:
      - status
    AppInfo:
      description: |-
        Installed application metadata. This is an open map: keys come straight from
        the app's Info.plist. Common keys are surfaced for discoverability but any
        additional keys may be present.
      example:
        Path: Path
        CFBundleShortVersionString: CFBundleShortVersionString
        UIFileSharingEnabled: true
        CFBundleIdentifier: CFBundleIdentifier
        CFBundleName: CFBundleName
        CFBundleExecutable: CFBundleExecutable
      properties:
        CFBundleIdentifier:
          type: string
        CFBundleExecutable:
          type: string
        CFBundleName:
          type: string
        CFBundleShortVersionString:
          type: string
        Path:
          type: string
        UIFileSharingEnabled:
          type: boolean
    AppStateNotification:
      description: An app foreground/background/lifecycle state change.
      properties:
        bundleId:
          description: Bundle id of the app whose state changed.
          type: string
        state:
          description: |-
            New application state.
            Typical values: `foreground`, `background`, `suspended`, `terminated`,
            `unknown`.
          type: string
        timestamp:
          description: Unix epoch milliseconds when the change was observed.
          format: int64
          type: integer
      required:
      - bundleId
      - state
    AssistiveTouchState:
      description: "`GET /device/{udid}/assistivetouch` — AssistiveTouch state."
      example:
        AssistiveTouchEnabled: true
      properties:
        AssistiveTouchEnabled:
          type: boolean
      required:
      - AssistiveTouchEnabled
    AttachDetachEvent:
      description: A device was attached to or detached from the host.
      properties:
        event:
          description: |-
            Event kind.
            `attached` when a device connects, `detached` when it disconnects,
            `paired` when a pairing record appears.
          type: string
        deviceID:
          description: usbmuxd device id.
          format: int32
          type: integer
        udid:
          description: "The device udid (serial number), when known."
          type: string
        properties:
          $ref: '#/components/schemas/DeviceProperties'
      required:
      - event
    BatteryInfo:
      description: |-
        `GET /device/{udid}/battery` — battery diagnostics (`ios.BatteryInfo`).
        Open map; commonly-present keys are surfaced for discoverability.
      example:
        FullyCharged: true
        Temperature: 6
        IsCharging: true
        CurrentCapacity: 0
        ExternalConnected: true
      properties:
        CurrentCapacity:
          format: int32
          type: integer
        ExternalConnected:
          type: boolean
        FullyCharged:
          type: boolean
        IsCharging:
          type: boolean
        Temperature:
          format: int32
          type: integer
    CpuUsageSample:
      description: A single sysmontap CPU-usage sample. Open map; sampler keys vary
        by OS.
      properties:
        CPU_TotalLoad:
          description: Total CPU load across all cores (0–100).
          format: double
          type: number
        SystemLoad:
          description: System (kernel) CPU load.
          format: double
          type: number
        UserLoad:
          description: User CPU load.
          format: double
          type: number
    CrashListing:
      description: "`GET /device/{udid}/crashes` — crash report names."
      example:
        count: 0
        files:
        - files
        - files
      properties:
        files:
          items:
            type: string
          type: array
        count:
          format: int32
          type: integer
      required:
      - count
      - files
    DevModeRequest:
      description: "`POST /device/{udid}/devmode` request."
      example:
        action: action
        enablePostRestart: true
      properties:
        action:
          description: "`enable` to turn developer mode on, `reveal` to expose the\
            \ settings menu."
          type: string
        enablePostRestart:
          description: "When enabling, also arm developer mode to persist across the\
            \ next reboot."
          type: boolean
      required:
      - action
    DevModeState:
      description: "`GET /device/{udid}/devmode` — developer mode state."
      example:
        DeveloperModeEnabled: true
      properties:
        DeveloperModeEnabled:
          type: boolean
      required:
      - DeveloperModeEnabled
    DeviceDate:
      description: "`GET /device/{udid}/date`."
      example:
        TimeIntervalSince1970: 0.8008281904610115
        formatedDate: formatedDate
      properties:
        formatedDate:
          description: Human-readable RFC850 date on the device.
          type: string
        TimeIntervalSince1970:
          description: Device clock as Unix epoch seconds.
          format: double
          type: number
      required:
      - TimeIntervalSince1970
      - formatedDate
    DeviceEntry:
      description: A single device as returned by `GET /list`.
      example:
        address: address
        messageType: messageType
        userspaceTUNPort: 2
        userspaceTUN: true
        userspaceTUNHost: userspaceTUNHost
        deviceID: 0
        properties:
          serialNumber: serialNumber
          productID: 5
          locationID: 5
          connectionSpeed: 6
          connectionType: connectionType
          deviceID: 1
      properties:
        deviceID:
          format: int32
          type: integer
        messageType:
          type: string
        properties:
          $ref: '#/components/schemas/DeviceProperties'
        address:
          description: Network address for a device reached over the network / tunnel.
          type: string
        userspaceTUN:
          description: True if reachable via the userspace TUN tunnel.
          type: boolean
        userspaceTUNHost:
          type: string
        userspaceTUNPort:
          format: int32
          type: integer
      required:
      - deviceID
      - properties
    DeviceInfo:
      description: |-
        `GET /device/{udid}/info` — lockdown values plus `instruments:*` keys.
        Open dictionary; values are heterogeneous.
      type: object
    DeviceList:
      description: Response of `GET /list`.
      example:
        deviceList:
        - address: address
          messageType: messageType
          userspaceTUNPort: 2
          userspaceTUN: true
          userspaceTUNHost: userspaceTUNHost
          deviceID: 0
          properties:
            serialNumber: serialNumber
            productID: 5
            locationID: 5
            connectionSpeed: 6
            connectionType: connectionType
            deviceID: 1
        - address: address
          messageType: messageType
          userspaceTUNPort: 2
          userspaceTUN: true
          userspaceTUNHost: userspaceTUNHost
          deviceID: 0
          properties:
            serialNumber: serialNumber
            productID: 5
            locationID: 5
            connectionSpeed: 6
            connectionType: connectionType
            deviceID: 1
      properties:
        deviceList:
          items:
            $ref: '#/components/schemas/DeviceEntry'
          type: array
      required:
      - deviceList
    DeviceName:
      description: "`GET /device/{udid}/devicename`."
      example:
        devicename: devicename
      properties:
        devicename:
          type: string
      required:
      - devicename
    DeviceProperties:
      description: Low-level device properties reported by usbmuxd / lockdown.
      example:
        serialNumber: serialNumber
        productID: 5
        locationID: 5
        connectionSpeed: 6
        connectionType: connectionType
        deviceID: 1
      properties:
        connectionSpeed:
          format: int32
          type: integer
        connectionType:
          type: string
        deviceID:
          format: int32
          type: integer
        locationID:
          format: int32
          type: integer
        productID:
          format: int32
          type: integer
        serialNumber:
          description: The device udid (serial number). This is what device-scoped
            routes key on.
          type: string
      required:
      - serialNumber
    Diagnostics:
      description: "`GET /device/{udid}/diagnostics` — all IORegistry/diagnostic values.\
        \ Open map."
      type: object
    EnabledRequest:
      description: Request body for the `enabled`-toggle settings endpoints.
      example:
        enabled: true
      properties:
        enabled:
          type: boolean
      required:
      - enabled
    FileDomain:
      anyOf:
      - type: string
      - enum:
        - app
        - app-group
        - crash
        - temp
        type: string
      description: Domain of the on-device file service.
    FileEntry:
      description: A single entry in a device directory listing.
      example:
        path: path
        size: 0
        name: name
        isDir: true
      properties:
        name:
          type: string
        path:
          type: string
        isDir:
          type: boolean
        size:
          format: int64
          type: integer
    FileListing:
      description: "`GET /device/{udid}/files` — directory listing."
      example:
        path: path
        count: 6
        files:
        - path: path
          size: 0
          name: name
          isDir: true
        - path: path
          size: 0
          name: name
          isDir: true
      properties:
        path:
          type: string
        files:
          items:
            $ref: '#/components/schemas/FileEntry'
          type: array
        count:
          format: int32
          type: integer
      required:
      - count
      - files
      - path
    FilePushResult:
      description: "`POST /device/{udid}/files/push` — acknowledgement."
      example:
        size: 0
        remote: remote
      properties:
        remote:
          type: string
        size:
          format: int64
          type: integer
      required:
      - remote
      - size
    ForwardRequest:
      description: "`POST /device/{udid}/jobs/forward` request."
      example:
        hostPort: 0
        targetPort: 6
      properties:
        hostPort:
          description: Local (host) TCP port to listen on.
          format: uint16
          type: integer
        targetPort:
          description: Device TCP port to forward to.
          format: uint16
          type: integer
      required:
      - hostPort
      - targetPort
    GenericResponse:
      description: |-
        The dominant response envelope used across the API. Success responses set
        `message`; error responses set `error`. Streaming/middleware paths that emit
        `gin.H{"error"|"message"}` are compatible with this shape.
      example:
        message: message
        error: error
      properties:
        message:
          description: Human-readable success or status message.
          type: string
        error:
          description: Human-readable error message. Present on failures.
          type: string
    Heartbeat:
      description: Periodic keep-alive frame emitted on every stream. Payload is empty.
      type: object
    IconLayout:
      description: "`GET /device/{udid}/icon-layout` — SpringBoard icon layout. Open\
        \ structure."
      type: object
    InstalledProfiles:
      description: |-
        `GET /device/{udid}/profiles` — installed configuration profiles.
        Open dictionary; values are heterogeneous.
      type: object
    Job:
      description: |-
        A long-running operation started via the REST API (test run, WDA runner,
        port forward). Mirrors the server's `jobView`.
      example:
        result: ""
        kind: kind
        startedAt: 2000-01-23T04:56:07.000+00:00
        id: id
        udid: udid
        error: error
        status: JobStatus
        finishedAt: 2000-01-23T04:56:07.000+00:00
      properties:
        id:
          description: "Opaque job id, e.g. `runtest-3`."
          type: string
        kind:
          description: "Job kind: `runtest`, `runwda` or `forward`."
          type: string
        udid:
          description: The device udid the job runs on.
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        startedAt:
          description: When the job started (ISO-8601).
          format: date-time
          type: string
        finishedAt:
          description: When the job reached a terminal state (absent while running).
          format: date-time
          type: string
        error:
          description: Error message when `status` is `failed`.
          type: string
        result: {}
      required:
      - id
      - kind
      - startedAt
      - status
      - udid
    JobLogEvents:
      anyOf:
      - $ref: '#/components/schemas/JobLogLine'
      - $ref: '#/components/schemas/Heartbeat'
    JobLogLine:
      description: A single line of a job's log output.
      properties:
        line:
          description: The raw log line (already newline-terminated in the buffer).
          type: string
      required:
      - line
    JobStatus:
      anyOf:
      - type: string
      - enum:
        - running
        - succeeded
        - failed
        - stopped
        type: string
      description: Job lifecycle state.
    LanguageConfiguration:
      description: |-
        Language/locale configuration (`ios.LanguageConfiguration`), returned by
        `GET/PUT /device/{udid}/lang`.
      example:
        Locale: Locale
        SupportedLanguages:
        - SupportedLanguages
        - SupportedLanguages
        Language: Language
        SupportedLocales:
        - SupportedLocales
        - SupportedLocales
      properties:
        Language:
          type: string
        Locale:
          type: string
        SupportedLocales:
          description: Supported locales advertised by the device.
          items:
            type: string
          type: array
        SupportedLanguages:
          description: Supported UI languages advertised by the device.
          items:
            type: string
          type: array
    ListenEvents:
      anyOf:
      - $ref: '#/components/schemas/AttachDetachEvent'
      - $ref: '#/components/schemas/Heartbeat'
    LockdownValues:
      description: "`GET /device/{udid}/lockdown` — all lockdown values. Open map."
      type: object
    MemLimitRequest:
      description: "`POST /device/{udid}/memlimitoff` request."
      example:
        process: process
      properties:
        process:
          description: Process name whose memory limit should be waived.
          type: string
      required:
      - process
    MemLimitResult:
      description: "`POST /device/{udid}/memlimitoff` response."
      example:
        process: process
        pid: 0
        disabled: true
      properties:
        process:
          type: string
        pid:
          format: int32
          type: integer
        disabled:
          type: boolean
      required:
      - disabled
      - pid
      - process
    MobileGestalt:
      description: "`GET /device/{udid}/mobilegestalt` — queried MobileGestalt keys.\
        \ Open map."
      type: object
    MountedImages:
      description: "`GET /device/{udid}/image/list` — mounted DDI signatures."
      example:
        count: 0
        signatures:
        - signatures
        - signatures
      properties:
        signatures:
          description: Hex-encoded image signatures.
          items:
            type: string
          type: array
        count:
          format: int32
          type: integer
      required:
      - count
      - signatures
    NotificationEvents:
      anyOf:
      - $ref: '#/components/schemas/AppStateNotification'
      - $ref: '#/components/schemas/Heartbeat'
    OsTraceEntry:
      description: A structured os_log trace entry.
      properties:
        pid:
          description: Process id that emitted the entry.
          format: int32
          type: integer
        processName:
          description: Emitting process/executable name.
          type: string
        level:
          description: "Log level, e.g. `default`, `info`, `debug`, `error`, `fault`."
          type: string
        subsystem:
          description: Subsystem string (e.g. `com.apple.network`).
          type: string
        category:
          description: Category within the subsystem.
          type: string
        message:
          description: The formatted log message.
          type: string
        timestamp:
          description: "Unix epoch milliseconds when the entry was emitted, if known."
          format: int64
          type: integer
      required:
      - message
    OsTraceEvents:
      anyOf:
      - $ref: '#/components/schemas/OsTraceEntry'
      - $ref: '#/components/schemas/Heartbeat'
    PasteboardContent:
      description: "`GET /device/{udid}/pasteboard` — clipboard contents."
      example:
        text: text
        present: true
      properties:
        present:
          description: Whether any text was present on the pasteboard.
          type: boolean
        text:
          description: The clipboard text (empty when `present` is false).
          type: string
      required:
      - present
      - text
    ProcessInfo:
      description: |-
        A running process entry (`instruments.ProcessInfo`) from
        `GET /device/{udid}/processes`.
      example:
        name: name
        pid: 0
        isApplication: true
        startDate: 2000-01-23T04:56:07.000+00:00
        realAppName: realAppName
      properties:
        pid:
          format: int32
          type: integer
        name:
          type: string
        realAppName:
          type: string
        isApplication:
          type: boolean
        startDate:
          description: "Process start time, ISO-8601."
          format: date-time
          type: string
      required:
      - name
      - pid
    Profile:
      description: A single condition profile within a `ProfileType`.
      example:
        identifier: identifier
        name: name
        description: description
      properties:
        description:
          type: string
        identifier:
          type: string
        name:
          type: string
      required:
      - identifier
      - name
    ProfileType:
      description: "A condition inducer profile type (e.g. thermal, network) with\
        \ its variants."
      example:
        isInternal: true
        identifier: identifier
        activeProfile: activeProfile
        name: name
        profiles:
        - identifier: identifier
          name: name
          description: description
        - identifier: identifier
          name: name
          description: description
        isDestructive: true
        profilesSorted: true
        isActive: true
      properties:
        activeProfile:
          type: string
        identifier:
          type: string
        profilesSorted:
          type: boolean
        isActive:
          type: boolean
        name:
          type: string
        isDestructive:
          type: boolean
        isInternal:
          type: boolean
        profiles:
          items:
            $ref: '#/components/schemas/Profile'
          type: array
      required:
      - identifier
      - name
      - profiles
    RunTestRequest:
      description: "`POST /device/{udid}/jobs/runtest` (and `runwda`) request."
      example:
        args:
        - args
        - args
        xctestConfig: xctestConfig
        testsToSkip:
        - testsToSkip
        - testsToSkip
        xctest: true
        testRunnerBundleId: testRunnerBundleId
        bundleId: bundleId
        env: "{}"
        testsToRun:
        - testsToRun
        - testsToRun
      properties:
        bundleId:
          description: Bundle id of the app under test.
          type: string
        testRunnerBundleId:
          description: Bundle id of the test runner. Defaults to `bundleId` if omitted.
          type: string
        xctestConfig:
          description: Name of the `.xctestconfiguration`.
          type: string
        env:
          description: Extra environment variables for the test runner.
          type: object
        args:
          description: Extra process arguments for the test runner.
          items:
            type: string
          type: array
        testsToRun:
          description: Only run these tests (`Class/method` identifiers).
          items:
            type: string
          type: array
        testsToSkip:
          description: Skip these tests.
          items:
            type: string
          type: array
        xctest:
          description: Run as a plain XCTest (vs XCUITest).
          type: boolean
    SecurityInfo:
      description: "`POST /device/{udid}/mdm/security-info` — device security info.\
        \ Open map."
      type: object
    SetLanguageRequest:
      description: "`PUT /device/{udid}/lang` request."
      example:
        language: language
        locale: locale
      properties:
        language:
          type: string
        locale:
          type: string
    StatusOk:
      description: "Simple `{ \"status\": \"ok\" }` acknowledgement used by MDM clear\
        \ operations."
      example:
        status: status
      properties:
        status:
          type: string
      required:
      - status
    SyslogEvents:
      anyOf:
      - $ref: '#/components/schemas/SyslogMessage'
      - $ref: '#/components/schemas/Heartbeat'
    SyslogMessage:
      description: A single syslog line from the device.
      properties:
        message:
          description: The raw log message text.
          type: string
        timestamp:
          description: "Unix epoch milliseconds when the line was emitted, if known."
          format: int64
          type: integer
      required:
      - message
    SysmontapEvents:
      anyOf:
      - $ref: '#/components/schemas/CpuUsageSample'
      - $ref: '#/components/schemas/Heartbeat'
    TimeFormatRequest:
      description: "`PUT /device/{udid}/timeformat` request."
      example:
        uses24Hour: true
      properties:
        uses24Hour:
          type: boolean
      required:
      - uses24Hour
    TimeFormatState:
      description: "`GET /device/{udid}/timeformat` — 24-hour clock state."
      example:
        Uses24HourClock: true
      properties:
        Uses24HourClock:
          type: boolean
      required:
      - Uses24HourClock
    Tunnel:
      description: |-
        A running device tunnel as reported by the tunnel agent
        (`GET /tunnels`, `POST /tunnels/{udid}/refresh`). Mirrors `tunnel.Tunnel`.
      example:
        Udid: Udid
        Address: Address
        UserspaceTUN: true
        RsdPort: 0
        UserspaceTUNPort: 6
      properties:
        Udid:
          description: The device udid this tunnel serves.
          type: string
        Address:
          description: Tunnel address (IPv6) reachable for RemoteXPC/RSD.
          type: string
        RsdPort:
          description: RemoteServiceDiscovery port on the tunnel.
          format: int32
          type: integer
        UserspaceTUN:
          description: Whether this tunnel is a userspace TUN.
          type: boolean
        UserspaceTUNPort:
          description: "Userspace TUN port, when `UserspaceTUN` is true."
          format: int32
          type: integer
      required:
      - Address
      - RsdPort
      - Udid
    TunnelStopped:
      description: "`DELETE /tunnels/{udid}` — acknowledgement that the tunnel was\
        \ stopped."
      example:
        udid: udid
        status: status
      properties:
        udid:
          type: string
        status:
          description: Always `stopped`.
          type: string
      required:
      - status
      - udid
    UnlockToken:
      description: "`POST /device/{udid}/mdm/fetch-unlock-token` — base64 escrow unlock\
        \ token."
      example:
        token: token
      properties:
        token:
          description: Base64-encoded escrow unlock token.
          type: string
      required:
      - token
    WdaConfig:
      description: Configuration for launching a WebDriverAgent (XCUITest) runner
        session.
      example:
        args:
        - args
        - args
        xcTestConfig: xcTestConfig
        testBundleId: testBundleId
        bundleId: bundleId
        env: "{}"
      properties:
        bundleId:
          description: Bundle id of the WDA runner host app (e.g. `com.facebook.WebDriverAgentRunner.xctrunner`).
          type: string
        testBundleId:
          description: Bundle id of the XCTest test bundle.
          type: string
        xcTestConfig:
          description: Path/name of the `.xctestconfiguration` to use.
          type: string
        args:
          description: Extra process arguments passed to the runner.
          items:
            type: string
          type: array
        env:
          description: Extra environment variables passed to the runner.
          type: object
      required:
      - bundleId
      - testBundleId
      - xcTestConfig
    WdaSession:
      description: A running WebDriverAgent session.
      example:
        sessionId: sessionId
        udid: udid
        config:
          args:
          - args
          - args
          xcTestConfig: xcTestConfig
          testBundleId: testBundleId
          bundleId: bundleId
          env: "{}"
      properties:
        config:
          $ref: '#/components/schemas/WdaConfig'
        sessionId:
          description: Opaque session identifier.
          type: string
        udid:
          description: The device udid the session runs on.
          type: string
      required:
      - config
      - sessionId
      - udid
    WifiRequest:
      description: "`PUT /device/{udid}/wifi` request."
      example:
        encType: encType
        password: password
        ssid: ssid
      properties:
        ssid:
          type: string
        password:
          type: string
        encType:
          description: "Encryption type, e.g. `WPA2`, `WPA`, `WEP`, `None`."
          type: string
      required:
      - ssid
    Devices_installApp_request:
      properties:
        file: {}
      required:
      - file
    Devices_setHttpProxy_request:
      properties:
        host:
          description: Proxy host.
          type: string
        port:
          description: Proxy port.
          type: string
        p12: {}
        user:
          description: Proxy username.
          type: string
        pass:
          description: Proxy password.
          type: string
        password:
          description: Passphrase for the `.p12` identity.
          type: string
      required:
      - host
      - p12
      - port
    Devices_getJob_404_response:
      anyOf:
      - $ref: '#/components/schemas/GenericResponse'
      - $ref: '#/components/schemas/GenericResponse'
    Devices_mdmClearPasscode_request:
      properties:
        p12: {}
        password:
          description: Passphrase for the `.p12` identity.
          type: string
        token:
          description: Base64-encoded escrow unlock token.
          type: string
      required:
      - p12
      - token
    Devices_mdmClearScreenTimePassword_request:
      properties:
        p12: {}
        password:
          description: Passphrase for the `.p12` identity.
          type: string
      required:
      - p12
    Devices_pair_request:
      properties:
        p12file: {}
      required:
      - p12file
    Devices_addProfile_request:
      properties:
        profile: {}
        p12: {}
        password:
          description: Passphrase for the `.p12` identity.
          type: string
      required:
      - profile
    Devices_setWallpaper_request:
      properties:
        image: {}
        p12: {}
        password:
          description: Passphrase for the `.p12` identity.
          type: string
        screen:
          description: "Target screen (`home`, `lock`, `both`)."
          type: string
      required:
      - image
      - p12
  securitySchemes:
    BearerAuth:
      scheme: Bearer
      type: http

