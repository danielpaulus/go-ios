    post:
      description: Activate the device (complete Setup Assistant / activation).
      operationId: Devices_activate
      parameters:
      - explode: false
        in: path
        name: udid
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
          description: The request has succeeded.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
          description: 401 — missing/invalid bearer token (when auth is enabled).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
          description: 404 — device (udid) not found.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
          description: 422 — empty/invalid udid.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
          description: 500 — internal error while talking to the device.
      summary: Activate device
