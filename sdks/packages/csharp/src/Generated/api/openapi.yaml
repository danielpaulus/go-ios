components:
  schemas:
    AXAuditIssue:
      description: |-
        One accessibility audit issue (`accessibility.AXAuditIssue`) from
        `POST /device/{udid}/ax/audit`. Open map — shape depends on the audit type.
      type: object
    AXElement:
      description: |-
        `GET /device/{udid}/ax` — a snapshot of the currently focused accessibility
        element. Open map (backend-defined element attributes).
      type: object
    AXEnabledRequest:
      description: |-
        Body for the accessibility toggle PUTs (`/voiceover`, `/zoom`). The desired
        state may also be supplied as an `enabled` query param; a parseable body wins.
      example:
        enabled: true
      properties:
        enabled:
          type: boolean
      required:
      - enabled
    AgentShutdown:
      description: '`POST /tunnel-agent/shutdown` — acknowledgement.'
      example:
        status: status
      properties:
        status:
          description: Always `agent shutdown requested`.
          type: string
      required:
      - status
    AppInfo:
      description: |-
        Installed application metadata. This is an open map: keys come straight from
        the app's Info.plist. Common keys are surfaced for discoverability but any
        additional keys may be present.
      example:
        Path: Path
        CFBundleShortVersionString: CFBundleShortVersionString
        UIFileSharingEnabled: true
        CFBundleIdentifier: CFBundleIdentifier
        CFBundleName: CFBundleName
        CFBundleExecutable: CFBundleExecutable
      properties:
        CFBundleIdentifier:
          type: string
        CFBundleExecutable:
          type: string
        CFBundleName:
          type: string
        CFBundleShortVersionString:
          type: string
        Path:
          type: string
        UIFileSharingEnabled:
          type: boolean
    AppStateNotification:
      description: An app foreground/background/lifecycle state change.
      properties:
        bundleId:
          description: Bundle id of the app whose state changed.
          type: string
        state:
          description: |-
            New application state.
            Typical values: `foreground`, `background`, `suspended`, `terminated`,
            `unknown`.
          type: string
        timestamp:
          description: Unix epoch milliseconds when the change was observed.
          format: int64
          type: integer
      required:
      - bundleId
      - state
    AssistiveTouchState:
      description: "`GET /device/{udid}/assistivetouch` — AssistiveTouch state."
      example:
        AssistiveTouchEnabled: true
      properties:
        AssistiveTouchEnabled:
          type: boolean
      required:
      - AssistiveTouchEnabled
    AttachDetachEvent:
      description: A device was attached to or detached from the host.
      properties:
        event:
          description: |-
            Event kind.
            `attached` when a device connects, `detached` when it disconnects,
            `paired` when a pairing record appears.
          type: string
        deviceID:
          description: usbmuxd device id.
          format: int32
          type: integer
        udid:
          description: "The device udid (serial number), when known."
          type: string
        properties:
          $ref: "#/components/schemas/DeviceProperties"
      required:
      - event
    BatteryInfo:
      description: |-
        `GET /device/{udid}/battery` — battery diagnostics (`ios.BatteryInfo`).
        Open map; commonly-present keys are surfaced for discoverability.
      example:
        FullyCharged: true
        Temperature: 6
        IsCharging: true
        CurrentCapacity: 0
        ExternalConnected: true
      properties:
        CurrentCapacity:
          format: int32
          type: integer
        ExternalConnected:
          type: boolean
        FullyCharged:
          type: boolean
        IsCharging:
          type: boolean
        Temperature:
          format: int32
          type: integer
    BatteryRegistry:
      description: |-
        `GET /device/{udid}/battery/registry` — battery IORegistry stats
        (`diagnostics.IORegistry`). Open map; common keys surfaced.
      example:
        FullyCharged: true
        Temperature: 0
        Voltage: 6
        InstantAmperage: 5
        IsCharging: true
        CurrentCapacity: 1
      properties:
        Temperature:
          format: int32
          type: integer
        Voltage:
          format: int32
          type: integer
        CurrentCapacity:
          format: int32
          type: integer
        InstantAmperage:
          format: int64
          type: integer
        IsCharging:
          type: boolean
        FullyCharged:
          type: boolean
    CloudConfig:
      description: |-
        `GET /device/{udid}/cloudconfig` — the device cloud configuration
        (`mcinstall` GetCloudConfiguration): supervision status, skip-setup options
        and organization info. Open map.
      type: object
    CpuUsageSample:
      description: A single sysmontap CPU-usage sample. Open map; sampler keys vary
        by OS.
      properties:
        CPU_TotalLoad:
          description: Total CPU load across all cores (0–100).
          format: double
          type: number
        SystemLoad:
          description: System (kernel) CPU load.
          format: double
          type: number
        UserLoad:
          description: User CPU load.
          format: double
          type: number
    CrashListing:
      description: "`GET /device/{udid}/crashes` — crash report names."
      example:
        count: 0
        files:
        - files
        - files
      properties:
        files:
          items:
            type: string
          type: array
        count:
          format: int32
          type: integer
      required:
      - count
      - files
    DevModeRequest:
      description: "`POST /device/{udid}/devmode` request."
      example:
        action: action
        enablePostRestart: true
      properties:
        action:
          description: "`enable` to turn developer mode on, `reveal` to expose the\
            \ settings menu."
          type: string
        enablePostRestart:
          description: "When enabling, also arm developer mode to persist across the\
            \ next reboot."
          type: boolean
      required:
      - action
    DevModeState:
      description: "`GET /device/{udid}/devmode` — developer mode state."
      example:
        DeveloperModeEnabled: true
      properties:
        DeveloperModeEnabled:
          type: boolean
      required:
      - DeveloperModeEnabled
    DeviceDate:
      description: "`GET /device/{udid}/date`."
      example:
        TimeIntervalSince1970: 0.8008281904610115
        formatedDate: formatedDate
      properties:
        formatedDate:
          description: Human-readable RFC850 date on the device.
          type: string
        TimeIntervalSince1970:
          description: Device clock as Unix epoch seconds.
          format: double
          type: number
      required:
      - TimeIntervalSince1970
      - formatedDate
    DeviceEntry:
      description: A single device as returned by `GET /list`.
      example:
        address: address
        messageType: messageType
        userspaceTUNPort: 2
        userspaceTUN: true
        userspaceTUNHost: userspaceTUNHost
        deviceID: 0
        properties:
          serialNumber: serialNumber
          productID: 5
          locationID: 5
          connectionSpeed: 6
          connectionType: connectionType
          deviceID: 1
      properties:
        deviceID:
          format: int32
          type: integer
        messageType:
          type: string
        properties:
          $ref: "#/components/schemas/DeviceProperties"
        address:
          description: Network address for a device reached over the network / tunnel.
          type: string
        userspaceTUN:
          description: True if reachable via the userspace TUN tunnel.
          type: boolean
        userspaceTUNHost:
          type: string
        userspaceTUNPort:
          format: int32
          type: integer
      required:
      - deviceID
      - properties
    DeviceInfo:
      description: |-
        `GET /device/{udid}/info` — lockdown values plus `instruments:*` keys.
        Open dictionary; values are heterogeneous.
      type: object
    DeviceList:
      description: Response of `GET /list`.
      example:
        deviceList:
        - address: address
          messageType: messageType
          userspaceTUNPort: 2
          userspaceTUN: true
          userspaceTUNHost: userspaceTUNHost
          deviceID: 0
          properties:
            serialNumber: serialNumber
            productID: 5
            locationID: 5
            connectionSpeed: 6
            connectionType: connectionType
            deviceID: 1
        - address: address
          messageType: messageType
          userspaceTUNPort: 2
          userspaceTUN: true
          userspaceTUNHost: userspaceTUNHost
          deviceID: 0
          properties:
            serialNumber: serialNumber
            productID: 5
            locationID: 5
            connectionSpeed: 6
            connectionType: connectionType
            deviceID: 1
      properties:
        deviceList:
          items:
            $ref: "#/components/schemas/DeviceEntry"
          type: array
      required:
      - deviceList
    DeviceName:
      description: "`GET /device/{udid}/devicename`."
      example:
        devicename: devicename
      properties:
        devicename:
          type: string
      required:
      - devicename
    DeviceProperties:
      description: Low-level device properties reported by usbmuxd / lockdown.
      example:
        serialNumber: serialNumber
        productID: 5
        locationID: 5
        connectionSpeed: 6
        connectionType: connectionType
        deviceID: 1
      properties:
        connectionSpeed:
          format: int32
          type: integer
        connectionType:
          type: string
        deviceID:
          format: int32
          type: integer
        locationID:
          format: int32
          type: integer
        productID:
          format: int32
          type: integer
        serialNumber:
          description: The device udid (serial number). This is what device-scoped
            routes key on.
          type: string
      required:
      - serialNumber
    Diagnostics:
      description: "`GET /device/{udid}/diagnostics` — all IORegistry/diagnostic values.\
        \ Open map."
      type: object
    DiskSpaceInfo:
      description: |-
        `GET /device/{udid}/diskspace` — AFC filesystem info (`afc.DeviceInfo`).
        Total/free/used bytes and block size. Open map; common keys surfaced.
      example:
        Model: Model
        FSBlockSize: 1
        FSFreeBytes: 6
        FSTotalBytes: 0
      properties:
        FSTotalBytes:
          description: Total filesystem capacity in bytes.
          format: int64
          type: integer
        FSFreeBytes:
          description: Free filesystem space in bytes.
          format: int64
          type: integer
        FSBlockSize:
          description: Filesystem block size in bytes.
          format: int64
          type: integer
        Model:
          description: AFC model identifier reported by the device.
          type: string
    EnabledRequest:
      description: Request body for the `enabled`-toggle settings endpoints.
      example:
        enabled: true
      properties:
        enabled:
          type: boolean
      required:
      - enabled
    FileDomain:
      anyOf:
      - type: string
      - enum:
        - app
        - app-group
        - crash
        - temp
        type: string
      description: Domain of the on-device file service.
    FileEntry:
      description: A single entry in a device directory listing.
      example:
        path: path
        size: 0
        name: name
        isDir: true
      properties:
        name:
          type: string
        path:
          type: string
        isDir:
          type: boolean
        size:
          format: int64
          type: integer
    FileListing:
      description: "`GET /device/{udid}/files` — directory listing."
      example:
        path: path
        count: 6
        files:
        - path: path
          size: 0
          name: name
          isDir: true
        - path: path
          size: 0
          name: name
          isDir: true
      properties:
        path:
          type: string
        files:
          items:
            $ref: "#/components/schemas/FileEntry"
          type: array
        count:
          format: int32
          type: integer
      required:
      - count
      - files
      - path
    FilePushResult:
      description: "`POST /device/{udid}/files/push` — acknowledgement."
      example:
        size: 0
        remote: remote
      properties:
        remote:
          type: string
        size:
          format: int64
          type: integer
      required:
      - remote
      - size
    ForwardRequest:
      description: "`POST /device/{udid}/jobs/forward` request."
      example:
        hostPort: 0
        targetPort: 6
      properties:
        hostPort:
          description: Local (host) TCP port to listen on.
          format: uint16
          type: integer
        targetPort:
          description: Device TCP port to forward to.
          format: uint16
          type: integer
      required:
      - hostPort
      - targetPort
    FsyncListing:
      description: "`GET /device/{udid}/fsync/ls` — a directory listing over AFC."
      example:
        path: path
        count: 0
        files:
        - files
        - files
      properties:
        path:
          description: The listed (cleaned) device path.
          type: string
        files:
          description: File/directory names in the listed directory.
          items:
            type: string
          type: array
        count:
          description: Number of entries.
          format: int32
          type: integer
      required:
      - count
      - files
      - path
    FsyncMessage:
      description: |-
        `POST /device/{udid}/fsync/mkdir` and `DELETE /device/{udid}/fsync/rm` —
        simple message + path acknowledgement.
      example:
        path: path
        message: message
      properties:
        message:
          description: "Human-readable result message (e.g. `created`, `removed`)."
          type: string
        path:
          description: The (cleaned) device path acted on.
          type: string
      required:
      - message
      - path
    FsyncPushResult:
      description: "`POST /device/{udid}/fsync/push` — result of an upload over AFC."
      example:
        path: path
        size: 0
      properties:
        path:
          description: Destination device path written.
          type: string
        size:
          description: Number of bytes written.
          format: int64
          type: integer
      required:
      - path
      - size
    FsyncTreeEntry:
      description: "One entry returned by the recursive `GET /device/{udid}/fsync/tree`\
        \ walk."
      example:
        path: path
        size: 0
        name: name
        isDir: true
      properties:
        path:
          description: Full device-side path of this entry.
          type: string
        name:
          description: Base name of the entry.
          type: string
        isDir:
          description: Whether the entry is a directory.
          type: boolean
        size:
          description: Size in bytes.
          format: int64
          type: integer
      required:
      - isDir
      - name
      - path
      - size
    FsyncTreeListing:
      description: "`GET /device/{udid}/fsync/tree` — a recursive directory walk over\
        \ AFC."
      example:
        path: path
        entries:
        - path: path
          size: 0
          name: name
          isDir: true
        - path: path
          size: 0
          name: name
          isDir: true
        count: 6
      properties:
        path:
          description: The root (cleaned) device path.
          type: string
        entries:
          description: Flattened list of entries in the subtree.
          items:
            $ref: "#/components/schemas/FsyncTreeEntry"
          type: array
        count:
          description: Number of entries.
          format: int32
          type: integer
      required:
      - count
      - entries
      - path
    GenericResponse:
      description: |-
        The dominant response envelope used across the API. Success responses set
        `message`; error responses set `error`. Streaming/middleware paths that emit
        `gin.H{"error"|"message"}` are compatible with this shape.
      example:
        message: message
        error: error
      properties:
        message:
          description: Human-readable success or status message.
          type: string
        error:
          description: Human-readable error message. Present on failures.
          type: string
    Heartbeat:
      description: Periodic keep-alive frame emitted on every stream. Payload is empty.
      type: object
    IconLayout:
      description: "`GET /device/{udid}/icon-layout` — SpringBoard icon layout. Open\
        \ structure."
      type: object
    InstalledProfiles:
      description: |-
        `GET /device/{udid}/profiles` — installed configuration profiles.
        Open dictionary; values are heterogeneous.
      type: object
    Job:
      description: |-
        A long-running operation started via the REST API (test run, WDA runner,
        port forward). Mirrors the server's `jobView`.
      example:
        result: ""
        kind: kind
        startedAt: 2000-01-23T04:56:07.000+00:00
        id: id
        udid: udid
        error: error
        status: JobStatus
        finishedAt: 2000-01-23T04:56:07.000+00:00
      properties:
        id:
          description: "Opaque job id, e.g. `runtest-3`."
          type: string
        kind:
          description: "Job kind: `runtest`, `runwda` or `forward`."
          type: string
        udid:
          description: The device udid the job runs on.
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        startedAt:
          description: When the job started (ISO-8601).
          format: date-time
          type: string
        finishedAt:
          description: When the job reached a terminal state (absent while running).
          format: date-time
          type: string
        error:
          description: Error message when `status` is `failed`.
          type: string
        result: {}
      required:
      - id
      - kind
      - startedAt
      - status
      - udid
    JobLogEvents:
      anyOf:
      - $ref: "#/components/schemas/JobLogLine"
      - $ref: "#/components/schemas/Heartbeat"
    JobLogLine:
      description: A single line of a job's log output.
      properties:
        line:
          description: The raw log line (already newline-terminated in the buffer).
          type: string
      required:
      - line
    JobStatus:
      anyOf:
      - type: string
      - enum:
        - running
        - succeeded
        - failed
        - stopped
        type: string
      description: Job lifecycle state.
    LanguageConfiguration:
      description: |-
        Language/locale configuration (`ios.LanguageConfiguration`), returned by
        `GET/PUT /device/{udid}/lang`.
      example:
        Locale: Locale
        SupportedLanguages:
        - SupportedLanguages
        - SupportedLanguages
        Language: Language
        SupportedLocales:
        - SupportedLocales
        - SupportedLocales
      properties:
        Language:
          type: string
        Locale:
          type: string
        SupportedLocales:
          description: Supported locales advertised by the device.
          items:
            type: string
          type: array
        SupportedLanguages:
          description: Supported UI languages advertised by the device.
          items:
            type: string
          type: array
    ListenEvents:
      anyOf:
      - $ref: "#/components/schemas/AttachDetachEvent"
      - $ref: "#/components/schemas/Heartbeat"
    LockdownValues:
      description: "`GET /device/{udid}/lockdown` — all lockdown values. Open map."
      type: object
    MemLimitRequest:
      description: "`POST /device/{udid}/memlimitoff` request."
      example:
        process: process
      properties:
        process:
          description: Process name whose memory limit should be waived.
          type: string
      required:
      - process
    MemLimitResult:
      description: "`POST /device/{udid}/memlimitoff` response."
      example:
        process: process
        pid: 0
        disabled: true
      properties:
        process:
          type: string
        pid:
          format: int32
          type: integer
        disabled:
          type: boolean
      required:
      - disabled
      - pid
      - process
    MobileGestalt:
      description: "`GET /device/{udid}/mobilegestalt` — queried MobileGestalt keys.\
        \ Open map."
      type: object
    MountedImages:
      description: "`GET /device/{udid}/image/list` — mounted DDI signatures."
      example:
        count: 0
        signatures:
        - signatures
        - signatures
      properties:
        signatures:
          description: Hex-encoded image signatures.
          items:
            type: string
          type: array
        count:
          format: int32
          type: integer
      required:
      - count
      - signatures
    NetworkInfo:
      description: |-
        `GET /device/{udid}/ip` — device network info discovered over pcapd
        (`pcap.NetworkInfo`).
      example:
        IPv6: IPv6
        IPv4: IPv4
        MacAddress: MacAddress
      properties:
        MacAddress:
          description: Hardware (MAC) address.
          type: string
        IPv4:
          description: "IPv4 address, when discovered."
          type: string
        IPv6:
          description: "IPv6 address, when discovered."
          type: string
    NotificationEvents:
      anyOf:
      - $ref: "#/components/schemas/AppStateNotification"
      - $ref: "#/components/schemas/Heartbeat"
    OsTraceEntry:
      description: A structured os_log trace entry.
      properties:
        pid:
          description: Process id that emitted the entry.
          format: int32
          type: integer
        processName:
          description: Emitting process/executable name.
          type: string
        level:
          description: "Log level, e.g. `default`, `info`, `debug`, `error`, `fault`."
          type: string
        subsystem:
          description: Subsystem string (e.g. `com.apple.network`).
          type: string
        category:
          description: Category within the subsystem.
          type: string
        message:
          description: The formatted log message.
          type: string
        timestamp:
          description: "Unix epoch milliseconds when the entry was emitted, if known."
          format: int64
          type: integer
      required:
      - message
    OsTraceEvents:
      anyOf:
      - $ref: "#/components/schemas/OsTraceEntry"
      - $ref: "#/components/schemas/Heartbeat"
    PasteboardContent:
      description: "`GET /device/{udid}/pasteboard` — clipboard contents."
      example:
        text: text
        present: true
      properties:
        present:
          description: Whether any text was present on the pasteboard.
          type: boolean
        text:
          description: The clipboard text (empty when `present` is false).
          type: string
      required:
      - present
      - text
    PrepareResult:
      description: "`POST /device/{udid}/prepare` — device preparation acknowledgement."
      example:
        supervised: true
        status: status
      properties:
        status:
          description: Always `prepared`.
          type: string
        supervised:
          description: Whether the device was supervised (a supervision cert was supplied).
          type: boolean
      required:
      - status
      - supervised
    PrepareSkipOptions:
      description: |-
        `GET /prepare/skip-options` — the static list of setup-pane skip options
        usable when preparing a device. Host-scoped (device-free).
      example:
        options:
        - options
        - options
        count: 0
      properties:
        options:
          description: All available skip-option identifiers.
          items:
            type: string
          type: array
        count:
          description: Number of options.
          format: int32
          type: integer
      required:
      - count
      - options
    ProcessInfo:
      description: |-
        A running process entry (`instruments.ProcessInfo`) from
        `GET /device/{udid}/processes`.
      example:
        name: name
        pid: 0
        isApplication: true
        startDate: 2000-01-23T04:56:07.000+00:00
        realAppName: realAppName
      properties:
        pid:
          format: int32
          type: integer
        name:
          type: string
        realAppName:
          type: string
        isApplication:
          type: boolean
        startDate:
          description: "Process start time, ISO-8601."
          format: date-time
          type: string
      required:
      - name
      - pid
    Profile:
      description: A single condition profile within a `ProfileType`.
      example:
        identifier: identifier
        name: name
        description: description
      properties:
        description:
          type: string
        identifier:
          type: string
        name:
          type: string
      required:
      - identifier
      - name
    ProfileType:
      description: "A condition inducer profile type (e.g. thermal, network) with\
        \ its variants."
      example:
        isInternal: true
        identifier: identifier
        activeProfile: activeProfile
        name: name
        profiles:
        - identifier: identifier
          name: name
          description: description
        - identifier: identifier
          name: name
          description: description
        isDestructive: true
        profilesSorted: true
        isActive: true
      properties:
        activeProfile:
          type: string
        identifier:
          type: string
        profilesSorted:
          type: boolean
        isActive:
          type: boolean
        name:
          type: string
        isDestructive:
          type: boolean
        isInternal:
          type: boolean
        profiles:
          items:
            $ref: "#/components/schemas/Profile"
          type: array
      required:
      - identifier
      - name
      - profiles
    ProvisioningResult:
      description: |-
        `POST /sign/provision` — provisioning assets envelope. The mobileprovision
        (and optionally the P12) are base64-encoded so one JSON response can carry
        both binary artifacts. Host-scoped (device-free).
      example:
        p12Password: p12Password
        certificateId: certificateId
        bundleId: bundleId
        mobileprovisionBase64: mobileprovisionBase64
        p12Base64: p12Base64
      properties:
        bundleId:
          description: The app bundle identifier registered with App Store Connect.
          type: string
        certificateId:
          description: The signing certificate resource id.
          type: string
        mobileprovisionBase64:
          description: "The `.mobileprovision`, base64-encoded."
          type: string
        p12Base64:
          description: "The generated `.p12`, base64-encoded (absent when reusing\
            \ a certificate)."
          type: string
        p12Password:
          description: "The password protecting `p12Base64`, echoed back (client-supplied)."
          type: string
      required:
      - bundleId
      - certificateId
      - mobileprovisionBase64
    RsdServiceEntry:
      description: A single RSD (Remote Service Discovery) service entry.
      properties:
        Port:
          description: TCP port the service is reachable on over the tunnel.
          format: int32
          type: integer
        ProtocolType:
          description: Wire protocol (e.g. `tcp`).
          type: string
    RsdServices:
      description: |-
        `GET /device/{udid}/rsd` — the device's Remote Service Discovery service list
        keyed by service name. Requires a running tunnel (iOS 17+); devices without
        RSD return `400`.
      type: object
    RunTestRequest:
      description: "`POST /device/{udid}/jobs/runtest` (and `runwda`) request."
      example:
        args:
        - args
        - args
        xctestConfig: xctestConfig
        testsToSkip:
        - testsToSkip
        - testsToSkip
        xctest: true
        testRunnerBundleId: testRunnerBundleId
        bundleId: bundleId
        env: "{}"
        testsToRun:
        - testsToRun
        - testsToRun
      properties:
        bundleId:
          description: Bundle id of the app under test.
          type: string
        testRunnerBundleId:
          description: Bundle id of the test runner. Defaults to `bundleId` if omitted.
          type: string
        xctestConfig:
          description: Name of the `.xctestconfiguration`.
          type: string
        env:
          description: Extra environment variables for the test runner.
          type: object
        args:
          description: Extra process arguments for the test runner.
          items:
            type: string
          type: array
        testsToRun:
          description: Only run these tests (`Class/method` identifiers).
          items:
            type: string
          type: array
        testsToSkip:
          description: Skip these tests.
          items:
            type: string
          type: array
        xctest:
          description: Run as a plain XCTest (vs XCUITest).
          type: boolean
    SecurityInfo:
      description: "`POST /device/{udid}/mdm/security-info` — device security info.\
        \ Open map."
      type: object
    SetLanguageRequest:
      description: "`PUT /device/{udid}/lang` request."
      example:
        language: language
        locale: locale
      properties:
        language:
          type: string
        locale:
          type: string
    StatusOk:
      description: "Simple `{ \"status\": \"ok\" }` acknowledgement used by MDM clear\
        \ operations."
      example:
        status: status
      properties:
        status:
          type: string
      required:
      - status
    SupervisionCert:
      description: |-
        `POST /prepare/create-cert` — a generated self-signed supervision identity,
        returned as DER (base64) and PEM for both the certificate and private key.
        Host-scoped (device-free).
      example:
        privateKeyDerBase64: privateKeyDerBase64
        privateKeyPem: privateKeyPem
        certPem: certPem
        certDerBase64: certDerBase64
      properties:
        certDerBase64:
          description: "Certificate in DER form, base64-encoded."
          type: string
        certPem:
          description: Certificate in PEM form.
          type: string
        privateKeyDerBase64:
          description: "Private key in DER form, base64-encoded."
          type: string
        privateKeyPem:
          description: Private key in PEM form.
          type: string
      required:
      - certDerBase64
      - certPem
      - privateKeyDerBase64
      - privateKeyPem
    SyslogEvents:
      anyOf:
      - $ref: "#/components/schemas/SyslogMessage"
      - $ref: "#/components/schemas/Heartbeat"
    SyslogMessage:
      description: A single syslog line from the device.
      properties:
        message:
          description: The raw log message text.
          type: string
        timestamp:
          description: "Unix epoch milliseconds when the line was emitted, if known."
          format: int64
          type: integer
      required:
      - message
    SysmontapEvents:
      anyOf:
      - $ref: "#/components/schemas/CpuUsageSample"
      - $ref: "#/components/schemas/Heartbeat"
    TimeFormatRequest:
      description: "`PUT /device/{udid}/timeformat` request."
      example:
        uses24Hour: true
      properties:
        uses24Hour:
          type: boolean
      required:
      - uses24Hour
    TimeFormatState:
      description: "`GET /device/{udid}/timeformat` — 24-hour clock state."
      example:
        Uses24HourClock: true
      properties:
        Uses24HourClock:
          type: boolean
      required:
      - Uses24HourClock
    Tunnel:
      description: |-
        A running device tunnel as reported by the tunnel agent
        (`GET /tunnels`, `POST /tunnels/{udid}/refresh`). Mirrors `tunnel.Tunnel`.
      example:
        Udid: Udid
        Address: Address
        UserspaceTUN: true
        RsdPort: 0
        UserspaceTUNPort: 6
      properties:
        Udid:
          description: The device udid this tunnel serves.
          type: string
        Address:
          description: Tunnel address (IPv6) reachable for RemoteXPC/RSD.
          type: string
        RsdPort:
          description: RemoteServiceDiscovery port on the tunnel.
          format: int32
          type: integer
        UserspaceTUN:
          description: Whether this tunnel is a userspace TUN.
          type: boolean
        UserspaceTUNPort:
          description: "Userspace TUN port, when `UserspaceTUN` is true."
          format: int32
          type: integer
      required:
      - Address
      - RsdPort
      - Udid
    TunnelStopped:
      description: "`DELETE /tunnels/{udid}` — acknowledgement that the tunnel was\
        \ stopped."
      example:
        udid: udid
        status: status
      properties:
        udid:
          type: string
        status:
          description: Always `stopped`.
          type: string
      required:
      - status
      - udid
    UIAPIRequest:
      description: |-
        `POST /device/{udid}/ui/api` request — raw passthrough to the backend
        (`uidriver.APIRequest`). For WDA supply `method`/`path`/`body`; for DeviceKit
        supply `rpcMethod`/`rpcParams`.
      example:
        path: path
        method: method
        rpcMethod: rpcMethod
        body: body
        rpcParams: ""
      properties:
        method:
          description: HTTP method for a WDA passthrough (defaults to GET).
          type: string
        path:
          description: HTTP path for a WDA passthrough (required for the wda backend).
          type: string
        body:
          description: Raw HTTP request body for a WDA passthrough (base64 bytes on
            the wire).
          type: string
        rpcMethod:
          description: JSON-RPC method name for a DeviceKit passthrough.
          type: string
        rpcParams: {}
    UIAppRequest:
      description: "`POST /device/{udid}/ui/app/{launch,terminate}` request."
      example:
        bundleId: bundleId
      properties:
        bundleId:
          type: string
      required:
      - bundleId
    UIButtonRequest:
      description: "`POST /device/{udid}/ui/button` request — hardware button by name."
      example:
        name: name
      properties:
        name:
          description: "Button name (e.g. `home`, `volumeup`). WDA supports only `home`."
          type: string
      required:
      - name
    UILongPressRequest:
      description: "`POST /device/{udid}/ui/longpress` request — press and hold at\
        \ (x,y)."
      example:
        duration: 1.4658129805029452
        x: 0
        "y": 6
      properties:
        x:
          format: int32
          type: integer
        "y":
          format: int32
          type: integer
        duration:
          description: Hold duration in seconds.
          format: double
          type: number
      required:
      - x
      - "y"
    UIOrientationRequest:
      description: "`PUT /device/{udid}/ui/orientation` request."
      example:
        orientation: orientation
      properties:
        orientation:
          description: "Target orientation (e.g. `PORTRAIT`, `LANDSCAPE`)."
          type: string
      required:
      - orientation
    UIResponse:
      description: |-
        A backend passthrough response. The body and content-type are forwarded from
        WDA/DeviceKit verbatim, so the shape is backend-defined (open map).
      type: object
    UISwipeRequest:
      description: "`POST /device/{udid}/ui/swipe` request — drag from (x1,y1) to\
        \ (x2,y2)."
      example:
        duration: 5.637376656633329
        y1: 6
        x1: 0
        y2: 5
        x2: 1
      properties:
        x1:
          format: int32
          type: integer
        y1:
          format: int32
          type: integer
        x2:
          format: int32
          type: integer
        y2:
          format: int32
          type: integer
        duration:
          description: Gesture duration in seconds.
          format: double
          type: number
      required:
      - x1
      - x2
      - y1
      - y2
    UITapRequest:
      description: "`POST /device/{udid}/ui/tap` request — absolute coordinates."
      example:
        x: 0
        "y": 6
      properties:
        x:
          format: int32
          type: integer
        "y":
          format: int32
          type: integer
      required:
      - x
      - "y"
    UITypeRequest:
      description: "`POST /device/{udid}/ui/type` request — keyboard input."
      example:
        text: text
      properties:
        text:
          type: string
      required:
      - text
    UnlockToken:
      description: "`POST /device/{udid}/mdm/fetch-unlock-token` — base64 escrow unlock\
        \ token."
      example:
        token: token
      properties:
        token:
          description: Base64-encoded escrow unlock token.
          type: string
      required:
      - token
    VoiceOverState:
      description: "`GET|PUT /device/{udid}/voiceover` — VoiceOver enabled state."
      example:
        VoiceOverEnabled: true
      properties:
        VoiceOverEnabled:
          type: boolean
      required:
      - VoiceOverEnabled
    WdaConfig:
      description: Configuration for launching a WebDriverAgent (XCUITest) runner
        session.
      example:
        args:
        - args
        - args
        xcTestConfig: xcTestConfig
        testBundleId: testBundleId
        bundleId: bundleId
        env: "{}"
      properties:
        bundleId:
          description: Bundle id of the WDA runner host app (e.g. `com.facebook.WebDriverAgentRunner.xctrunner`).
          type: string
        testBundleId:
          description: Bundle id of the XCTest test bundle.
          type: string
        xcTestConfig:
          description: Path/name of the `.xctestconfiguration` to use.
          type: string
        args:
          description: Extra process arguments passed to the runner.
          items:
            type: string
          type: array
        env:
          description: Extra environment variables passed to the runner.
          type: object
      required:
      - bundleId
      - testBundleId
      - xcTestConfig
    WdaSession:
      description: A running WebDriverAgent session.
      example:
        sessionId: sessionId
        udid: udid
        config:
          args:
          - args
          - args
          xcTestConfig: xcTestConfig
          testBundleId: testBundleId
          bundleId: bundleId
          env: "{}"
      properties:
        config:
          $ref: "#/components/schemas/WdaConfig"
        sessionId:
          description: Opaque session identifier.
          type: string
        udid:
          description: The device udid the session runs on.
          type: string
      required:
      - config
      - sessionId
      - udid
    WebInspectorEvalRequest:
      description: "`POST /device/{udid}/webinspector/eval` request body."
      example:
        bundleId: bundleId
        page: page
        script: script
      properties:
        page:
          description: |-
            Inspectable page key. When empty the first matching web/javascript page
            (optionally scoped by `bundleId`) is used.
          type: string
        bundleId:
          description: Optional bundle id to scope page selection.
          type: string
        script:
          description: JavaScript source to evaluate. Required.
          type: string
      required:
      - script
    WebInspectorEvalResult:
      description: "`POST /device/{udid}/webinspector/eval` — evaluation result."
      example:
        result: ""
        page: page
      properties:
        page:
          description: The page key the script ran in.
          type: string
        result: {}
      required:
      - page
      - result
    WebInspectorLaunchRequest:
      description: "`POST /device/{udid}/webinspector/launch` request body."
      example:
        bundleId: bundleId
        url: url
      properties:
        url:
          description: URL to open. May alternatively be supplied as the `url` query
            param.
          type: string
        bundleId:
          description: Bundle id to open the URL in. Defaults to Safari.
          type: string
    WebInspectorLaunchResult:
      description: "`POST /device/{udid}/webinspector/launch` — result of opening\
        \ a URL."
      example:
        bundleId: bundleId
        title: title
        url: url
      properties:
        bundleId:
          description: Bundle id the page was opened in.
          type: string
        url:
          description: The resolved current URL after navigation.
          type: string
        title:
          description: The page title after navigation.
          type: string
      required:
      - bundleId
      - title
      - url
    WebInspectorPage:
      description: |-
        One inspectable page (`webinspector.ApplicationPage`) from
        `GET /device/{udid}/webinspector/pages`. Open map — carries the application
        and page descriptors as the device reports them.
      type: object
    WifiRequest:
      description: "`PUT /device/{udid}/wifi` request."
      example:
        encType: encType
        password: password
        ssid: ssid
      properties:
        ssid:
          type: string
        password:
          type: string
        encType:
          description: "Encryption type, e.g. `WPA2`, `WPA`, `WEP`, `None`."
          type: string
      required:
      - ssid
    ZoomTouchState:
      description: "`GET|PUT /device/{udid}/zoom` — ZoomTouch enabled state."
      example:
        ZoomTouchEnabled: true
      properties:
        ZoomTouchEnabled:
          type: boolean
      required:
      - ZoomTouchEnabled
    Devices_installApp_request:
      properties:
        file: {}
      required:
      - file
    Devices_setHttpProxy_request:
      properties:
        host:
          description: Proxy host.
          type: string
        port:
          description: Proxy port.
          type: string
        p12: {}
        user:
          description: Proxy username.
          type: string
        pass:
          description: Proxy password.
          type: string
        password:
          description: Passphrase for the `.p12` identity.
          type: string
      required:
      - host
      - p12
      - port
    Devices_getJob_404_response:
      anyOf:
      - $ref: "#/components/schemas/GenericResponse"
      - $ref: "#/components/schemas/GenericResponse"
    Devices_mdmClearPasscode_request:
      properties:
        p12: {}
        password:
          description: Passphrase for the `.p12` identity.
          type: string
        token:
          description: Base64-encoded escrow unlock token.
          type: string
      required:
      - p12
      - token
    Devices_mdmClearScreenTimePassword_request:
      properties:
        p12: {}
        password:
          description: Passphrase for the `.p12` identity.
          type: string
      required:
      - p12
    Devices_pair_request:
      properties:
        p12file: {}
      required:
      - p12file
    Prepare_prepareDevice_request:
      properties:
        cert: {}
        p12password:
          description: P12 password (when `cert` is a P12).
          type: string
        skip:
          description: Setup panes to skip (see /prepare/skip-options). Repeatable.
          items:
            type: string
          type: array
        orgname:
          description: Supervision organization name.
          type: string
        locale:
          description: Device locale (default en_US).
          type: string
        lang:
          description: Device language (default en).
          type: string
    Devices_addProfile_request:
      properties:
        profile: {}
        p12: {}
        password:
          description: Passphrase for the `.p12` identity.
          type: string
      required:
      - profile
    Accessibility_setLocationGpx_request:
      properties:
        gpx: {}
      required:
      - gpx
    Devices_setWallpaper_request:
      properties:
        image: {}
        p12: {}
        password:
          description: Passphrase for the `.p12` identity.
          type: string
        screen:
          description: "Target screen (`home`, `lock`, `both`)."
          type: string
      required:
      - image
      - p12
    signApp_request:
      properties:
        ipa: {}
        p12file: {}
        profile: {}
        p12password:
          description: P12 password.
          type: string
        bundleid:
          description: Override bundle id.
          type: string
      required:
      - ipa
      - p12file
      - profile
    signCertificate_request:
      properties:
        asc-private-key: {}
        asc-key-id:
          description: App Store Connect key id.
          type: string
        asc-issuer-id:
          description: App Store Connect issuer id.
          type: string
        revoke-existing:
          description: Revoke existing iOS Development certificates first.
          type: string
        p12password:
          description: Password to protect the generated P12.
          type: string
      required:
      - asc-issuer-id
      - asc-key-id
      - asc-private-key
    signProvision_request:
      properties:
        asc-private-key: {}
        asc-key-id:
          description: App Store Connect key id.
          type: string
        asc-issuer-id:
          description: App Store Connect issuer id.
          type: string
        bundleid:
          description: App bundle identifier.
          type: string
        udid:
          description: Target device udid to register against the profile.
          type: string
        bundlename:
          description: Bundle display name.
          type: string
        profilename:
          description: Provisioning profile name.
          type: string
        devicename:
          description: Device display name.
          type: string
        certificate-id:
          description: Reuse an existing certificate (no new P12 is generated).
          type: string
        revoke-existing:
          description: Revoke existing certificates first.
          type: string
        p12password:
          description: Password to protect the generated P12.
          type: string
      required:
      - asc-issuer-id
      - asc-key-id
      - asc-private-key
      - bundleid
      - udid
  securitySchemes:
    BearerAuth:
      scheme: Bearer
      type: http

