on:
  workflow_dispatch:

name: CI Real Device Test
jobs:
  e2e:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Commands served over the classic lockdown/usbmux services. These work on
      # every device regardless of iOS version, so point GO_IOS_E2E_DEVICES at
      # the full device list.
      - name: E2E tunnel-free
        env:
          GO_IOS_E2E_DEVICES: ${{ vars.GO_IOS_E2E_DEVICES }}
        run: go test -tags=e2e -count=1 -v ./test/e2e/

      # Commands that need the iOS 17+ tunnel (RemoteServiceDiscovery /
      # CoreDevice / instruments) plus a mounted Developer Disk Image and
      # Developer Mode enabled on the device. This step targets its own device
      # list (GO_IOS_E2E_TUNNEL_DEVICES) so you can run it on a subset, and is
      # skipped entirely when that variable is empty. Requires the `ios tunnel`
      # daemon running on the runner host.
      - name: E2E tunnel (iOS 17+)
        if: ${{ !cancelled() && vars.GO_IOS_E2E_TUNNEL_DEVICES != '' }}
        env:
          GO_IOS_E2E_DEVICES: ${{ vars.GO_IOS_E2E_TUNNEL_DEVICES }}
        run: go test -tags=e2e -count=1 -v ./test/e2e/tunnel/
