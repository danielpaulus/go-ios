on:
  workflow_dispatch:

name: CI Real Device Test
jobs:
  list:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build

      - name: List devices
        run: go run main.go list
